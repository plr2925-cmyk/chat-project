<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Простой чат</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; color: #111827; }
    .box { width: 100%; max-width: 480px; height: 90vh; max-height: 640px; background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.1); display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 14px 16px; background: #2563eb; color: #fff; font-weight: 600; display: flex; justify-content: space-between; }
    #login { padding: 30px 20px; display: flex; flex-direction: column; gap: 12px; margin: auto 0; }
    #chat { display: none; flex: 1; flex-direction: column; min-height: 0; }
    #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: #f9fafb; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; background: #e5e7eb; align-self: flex-start; word-wrap: break-word; }
    .msg.me { background: #2563eb; color: #fff; align-self: flex-end; }
    .msg .meta { font-size: 12px; opacity: .75; margin-bottom: 2px; }
    .msg .meta b { margin-right: 6px; }
    .system { align-self: center; font-size: 13px; color: #6b7280; background: #fef3c7; padding: 4px 10px; border-radius: 10px; }
    #form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e5e7eb; }
    input { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; }
    button { padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <header>
      <span>Простой чат</span>
      <span id="online"></span>
    </header>

    <form id="login">
      <h2 style="margin:0">Как тебя зовут?</h2>
      <input id="name-input" placeholder="Введи имя" maxlength="20" autocomplete="off" />
      <button>Войти в чат</button>
    </form>

    <div id="chat">
      <div id="messages"></div>
      <form id="form">
        <input id="text-input" placeholder="Сообщение..." maxlength="500" autocomplete="off" />
        <button>Отправить</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
